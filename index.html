<!DOCTYPE html>
<html
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:xlink="http://www.w3.org/1999/xlink"
>
<head>
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta http-equiv="cache-control" content="no-cache" />
  <meta charset="utf-8" />

  <title>ScratchJr</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: white;
      overflow: hidden;
    }

    #scratchjr-container {
      width: 80%;
      height: 100%;
      position: relative;
      overflow: hidden;
      transform-origin: top left;
    }

    #frame,
    #libframe,
    #paintframe {
      transform-origin: top left;
    }
  </style>

  <script>
    window.scratchJrPage = "editor";

    // Read initial project data from URL hash or query param
    // Hash: iframe.src = "index.html#" + encodeURIComponent(jsonString)
    // Query: iframe.src = "index.html?data=" + jsonString (legacy)

    if (window.location.hash && window.location.hash.length > 1) {
      try {
        window.savedContent = decodeURIComponent(
          window.location.hash.substring(1)
        );
      } catch (e) {
        window.savedContent = window.location.hash.substring(1);
      }
    } else {
      var urlParams = new URLSearchParams(window.location.search);
      var dataParam = urlParams.get("data");

      if (dataParam) {
        window.savedContent = dataParam;
      }
    }

    // Support postMessage for loading data after init
    window.addEventListener("message", function (e) {
      if (e.data && e.data.type === "LOAD_DATA") {
        window.__scratchJrLoadData = e.data.data;

        if (window.__scratchJrReady && window.__loadExternalProject) {
          window.__loadExternalProject(e.data.data);
        }
      }

      if (e.data && e.data.type === "REQUEST_SAVE") {
        if (window.__scratchJrReady && window.__requestSave) {
          window.__requestSave();
        }
      }
    });
  </script>

  <script defer src="bundle.js"></script>
</head>

<body>
  <div id="scratchjr-container">
    <div class="frame" id="frame"></div>
    <div class="libframe" id="libframe"></div>
    <div class="paintframe" id="paintframe"></div>
  </div>
</body>
</html>
